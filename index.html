<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>
<style>
body {
  background:#400;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}
.card {
  background:#222;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
button {
  display:block;
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#3b7ddd;
  color:#fff;
  font-size:16px;
}
img {
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>
<body>

<h2>Another Your Life</h2>

<div id="stats" class="card"></div>
<img id="image">
<div id="event" class="card"></div>
<div id="choices"></div>

<script>

// ================= 状態 =================
let state = {
  name: "吉田 稔",
  age: 15,
  hp: 100,
  happiness: 50,
  alive: true
};

// ================= 画像 =================
function setImage(type){
  const map = {
    student: "school",
    work: "office",
    love: "couple",
    accident: "accident",
    money: "money",
    life: "life"
  };

  const keyword = map[type] || "life";

  document.getElementById("image").src =
    "https://picsum.photos/600?random=" + keyword + Math.random();
}

// ================= 描画 =================
function draw(){

  if(!state.alive){
    document.getElementById("event").innerText =
      "あなたは" + state.age + "歳で死亡した";
    document.getElementById("choices").innerHTML = "";
    return;
  }

  document.getElementById("stats").innerText =
    `${state.name} | 年齢:${state.age} HP:${state.hp} 幸福:${state.happiness}`;

  const e = pickEvent();

  setImage(e.type);

  document.getElementById("event").innerText = e.text;

  const div = document.getElementById("choices");
  div.innerHTML = "";

  // 🎲 サイコロ
  if(e.dice){
    const btn = document.createElement("button");
    btn.innerText = "🎲 運命に任せる";
    btn.onclick = ()=>{
      const r = Math.random();
      if(r < 0.5){
        e.success(state);
      }else{
        e.fail(state);
      }
      next();
    };
    div.appendChild(btn);
    return;
  }

  // 通常選択
  e.choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.innerText = c.text;
    btn.onclick = ()=>{
      c.effect(state);
      next();
    };
    div.appendChild(btn);
  });
}

// ================= 次へ =================
function next(){
  state.age++;

  if(state.hp <= 0){
    state.alive = false;
  }

  draw();
}

// ================= イベント選択 =================
function pickEvent(){

  // 🎲 20%で強制サイコロ
  if(Math.random() < 0.2){
    return EVENTS.find(e => e.dice);
  }

  const valid = EVENTS.filter(e => !e.condition || e.condition(state));

  return valid[Math.floor(Math.random() * valid.length)];
}

// ================= イベント =================
const EVENTS = [

  // 学生
  {
    type: "student",
    condition: s => s.age < 18,
    text: "学生生活",
    choices: [
      { text:"勉強", effect:s=>{ s.hp-=2; s.happiness-=1 }},
      { text:"遊ぶ", effect:s=>{ s.happiness+=3; s.hp-=1 }}
    ]
  },

  // 社会人
  {
    type: "work",
    condition: s => s.age >= 18,
    text: "仕事のストレス",
    choices: [
      { text:"頑張る", effect:s=>{ s.hp-=10; s.happiness+=1 }},
      { text:"逃げる", effect:s=>{ s.happiness-=5 }}
    ]
  },

  // 恋愛
  {
    type: "love",
    text: "恋のチャンス",
    choices: [
      { text:"告白", effect:s=>{ s.happiness+=10 }},
      { text:"何もしない", effect:s=>{} }
    ]
  },

  // 宝くじ
  {
    type: "money",
    text: "宝くじを見つけた",
    choices: [
      { text:"換金する", effect:s=>{ s.happiness+=20 }},
      { text:"無視する", effect:s=>{} }
    ]
  },

  // 🎲 運命（事故）
  {
    type: "accident",
    text: "事故が起きた（運命）",
    dice: true,
    success: s => { s.hp -= 20; },
    fail: s => { s.hp -= 5; }
  }

];

// ================= 起動 =================
draw();

</script>

</body>
</html>
