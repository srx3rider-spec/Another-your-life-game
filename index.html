<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#300;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
  max-width:700px;
  margin:auto;
}
.card{
  background:#222;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
button{
  width:100%;
  margin:8px 0;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#3b7ddd;
  color:#fff;
  font-size:16px;
}
img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}
#dice{
  text-align:center;
  font-size:22px;
  margin:10px;
}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="status"></div>
<img id="image">
<div class="card" id="event"></div>
<div id="dice"></div>
<div id="choices"></div>

<script>

// ===== 状態 =====
let state = {
  age:15,
  hp:100,
  money:50,
  happiness:50
};

// ===== イベント定義（全部入り）=====
const EVENTS = [

{type:"student", text:"勉強する？",
choices:[
{text:"勉強",effect:s=>{s.happiness+=2;}},
{text:"遊ぶ",effect:s=>{s.happiness+=5; s.hp-=3;}}
]},

{type:"love", text:"好きな人がいる",
choices:[
{text:"告白",effect:s=>{s.happiness+=15;}},
{text:"諦める",effect:s=>{s.happiness-=3;}}
]},

{type:"work", text:"仕事が忙しい",
choices:[
{text:"頑張る",effect:s=>{s.money+=30; s.hp-=5;}},
{text:"休む",effect:s=>{s.hp+=5;}}
]},

{type:"health", text:"体調が悪い",
choices:[
{text:"休む",effect:s=>{s.hp+=10;}},
{text:"無理する",effect:s=>{s.hp-=10; s.money+=10;}}
]},

{type:"money", dice:true, text:"宝くじを拾った",
resolve:(r,s)=>{
if(r<=2){return"ハズレ";}
if(r<=4){s.money+=20;return"小当たり";}
s.money+=100;return"大当たり！";
}},

{type:"accident", dice:true, text:"事故が起きた",
resolve:(r,s)=>{
if(r<=2){s.hp-=20;return"ケガ";}
if(r<=4){s.hp-=10;return"軽傷";}
return"無傷！";
}}

];

// ===== 画像（ちゃんと意味ある）=====
function setImage(type){

  const map={
    student:"school",
    love:"couple",
    work:"office",
    health:"hospital",
    money:"money",
    accident:"accident"
  };

  const key = map[type] || "life";

  document.getElementById("image").src =
    "https://source.unsplash.com/800x400/?"+key;
}

// ===== ステータス表示 =====
function updateStatus(){
  status.innerText =
  `年齢:${state.age}  HP:${state.hp}  金:${state.money}  幸福:${state.happiness}`;
}

// ===== 年齢ごとのイベント制御 =====
function pickEvent(){

  if(state.age < 18){
    return EVENTS.filter(e=>e.type==="student"||e.type==="love");
  }

  if(state.age < 60){
    return EVENTS;
  }

  return EVENTS.filter(e=>e.type!=="student");
}

// ===== メイン処理 =====
function next(){

  if(state.hp <= 0){
    event.innerText="💀 死亡エンド";
    choices.innerHTML="";
    return;
  }

  if(state.age > 80){
    event.innerText="🏁 人生完走エンド";
    choices.innerHTML="";
    return;
  }

  state.age++;

  const pool = pickEvent();
  const e = pool[Math.floor(Math.random()*pool.length)];

  setImage(e.type);
  event.innerText = e.text;

  choices.innerHTML="";
  dice.innerText="";

  // ===== サイコロイベント =====
  if(e.dice){

    const btn=document.createElement("button");
    btn.innerText="🎲 運命に任せる";

    btn.onclick=()=>{
      const r=Math.floor(Math.random()*6)+1;
      const result=e.resolve(r,state);

      dice.innerText=`🎲 ${r} → ${result}`;

      updateStatus();

      setTimeout(next,1000);
    };

    choices.appendChild(btn);
    return;
  }

  // ===== 通常選択 =====
  e.choices.forEach(c=>{
    const btn=document.createElement("button");
    btn.innerText=c.text;

    btn.onclick=()=>{
      c.effect(state);
      updateStatus();
      next();
    };

    choices.appendChild(btn);
  });
}

// ===== 初期化 =====
updateStatus();
next();

</script>

</body>
</html>
