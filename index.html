<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>
<style>
body{
  background:#0b3d2e;
  color:white;
  font-family:sans-serif;
  padding:20px;
}
.box{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
}
button{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#3b82f6;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Another Your Life</h1>

<div id="status" class="box"></div>
<div id="event" class="box"></div>
<div id="choices"></div>

<script>

// ======================
// STATE
// ======================

// ======================
// フェーズ
// ======================
// ======================
// STATE（上に1回だけ置く）
// ======================
let state = {
  age:15,
  money:50,
  social:50,
  love:0,
  children:0,
  flags:{},
  job:null,
  phase:"student",
  partner:null,
  married:false,
  hp:100
};

// ======================
// フェーズ判定
// ======================
function updatePhase(){

  if(state.age < 18){
    state.phase = "student";
  }
  else if(state.age < 23 && state.job === "大学生"){
    state.phase = "college";
  }
  else{
    state.phase = "adult";
  }

}

// ======================
// パートナー生成
// ======================
function createPartner(){
  const names=["あや","ゆい","さき","みき"];
  return {name:names[Math.floor(Math.random()*names.length)]};
}

// ======================
// イベント
// ======================
const EVENTS=[

// ----------------
// 初期
// ----------------
{
  id:"start",
  priority:100,
  condition:s=>s.age===15,
  text:"高校生活スタート",
  choices:[
    {text:"勉強",effect:s=>{s.social+=5}},
    {text:"遊ぶ",effect:s=>{s.love+=5}}
  ]
},

// ----------------
// 進路（18歳固定）
// ----------------
{
  id:"career",
  priority:200,
  condition:s=>s.age===18 && !s.job,
  text:"進路を決める",
  choices:[
    {text:"大学進学",effect:s=>{s.job="大学生"; s.money-=10}},
    {text:"就職",effect:s=>{s.job="会社員"; s.money+=10}},
    {text:"フリーター",effect:s=>{s.job="フリーター"}}
  ]
},

// ----------------
// 大学生活
// ----------------
{
  id:"college",
  priority:50,
  condition:s=>s.job==="大学生" && s.age<=22,
  text:"大学生活",
  choices:[
    {text:"勉強",effect:s=>{s.social+=5}},
    {text:"遊ぶ",effect:s=>{s.love+=5}},
    {text:"サボる",effect:s=>{s.money-=5}}
  ]
},

// ----------------
// 卒業
// ----------------
{
  id:"graduate",
  priority:150,
  condition:s=>s.job==="大学生" && s.age===22,
  text:"卒業後どうする？",
  choices:[
    {text:"就職",effect:s=>{s.job="会社員"; s.money+=20}},
    {text:"フリーター",effect:s=>{s.job="フリーター"}}
  ]
},

// ----------------
// 仕事
// ----------------
{
  id:"work",
  priority:40,
  condition:s=>s.job==="会社員",
  text:"仕事の日",
  choices:[
    {text:"働く",effect:s=>{s.money+=10}},
    {text:"サボる",effect:s=>{s.social-=5}}
  ]
},

// ----------------
// 出会い
// ----------------
{
  id:"meet",
  priority:60,
  condition:s=>!s.partner && s.age>=18,
  text:"出会いがあった",
  choices:[
    {text:"話す",effect:s=>{s.partner=createPartner(); s.love=30}},
    {text:"無視",effect:s=>{}}
  ]
},

// ----------------
// 恋愛
// ----------------
{
  id:"love",
  priority:50,
  condition:s=>s.partner && !s.married,
  text:s=>`${s.partner.name}と過ごしている`,
  choices:[
    {text:"デート",effect:s=>{s.love+=10}},
    {text:"放置",effect:s=>{s.love-=10}}
  ]
},

// ----------------
// 結婚
// ----------------
{
  id:"marry",
  priority:100,
  condition:s=>s.partner && s.love>=80 && !s.married,
  text:"結婚する？",
  choices:[
    {text:"結婚",effect:s=>{s.married=true}},
    {text:"やめる",effect:s=>{}}
  ]
},

// ----------------
// 子供
// ----------------
{
  id:"child",
  priority:80,
  condition:s=>s.married && Math.random()<0.3,
  text:"子供が生まれた",
  choices:[
    {text:"育てる",effect:s=>{s.children++; s.money-=10}},
    {text:"負担",effect:s=>{s.hp-=10}}
  ]
},

// ----------------
// 事故
// ----------------
{
  id:"accident",
  priority:120,
  condition:s=>Math.random()<0.05,
  text:"事故にあった",
  choices:[
    {text:"軽傷",effect:s=>{s.hp-=10}},
    {text:"重傷",effect:s=>{s.hp-=30}}
  ]
},

// ----------------
// 病気
// ----------------
{
  id:"illness",
  priority:110,
  condition:s=>Math.random()<0.05,
  text:"病気になった",
  choices:[
    {text:"治療",effect:s=>{s.money-=10; s.hp-=5}},
    {text:"放置",effect:s=>{s.hp-=20}}
  ]
},

// ----------------
// 日常
// ----------------
{
  id:"daily",
  priority:1,
  condition:s=>true,
  text:"日常",
  choices:[
    {text:"過ごす",effect:s=>{}}
  ]
},
// =====================
// 恋愛チェーン開始
// =====================

// 別の出会い
{
  id:"sub_meet",
  priority:90,
  condition:s=>s.partner && !s.flags?.subLove && Math.random()<0.2,
  text:"別の気になる人と出会った",
  choices:[
    {
      text:"興味を持つ",
      effect:s=>{
        if(!s.flags) s.flags={};
        s.flags.subLove=true;
      }
    },
    {
      text:"スルー",
      effect:s=>{}
    }
  ]
},

// ちょっかい
{
  id:"flirt",
  priority:85,
  condition:s=>s.flags?.subLove && !s.flags.flirting,
  text:"少し距離を縮める機会があった",
  choices:[
    {
      text:"ちょっかいを出す",
      effect:s=>{
        s.flags.flirting=true;
      }
    },
    {
      text:"やめておく",
      effect:s=>{
        s.flags.subLove=false;
      }
    }
  ]
},

// 親密化
{
  id:"close",
  priority:80,
  condition:s=>s.flags?.flirting && !s.flags.close,
  text:"関係が少しずつ近づいている",
  choices:[
    {
      text:"さらに距離を縮める",
      effect:s=>{
        s.flags.close=true;
      }
    },
    {
      text:"距離を保つ",
      effect:s=>{
        s.flags.flirting=false;
      }
    }
  ]
},

// 浮気
{
  id:"cheat",
  priority:95,
  condition:s=>s.flags?.close && !s.flags.cheating,
  text:"一線を越えそうだ",
  choices:[
    {
      text:"踏み越える",
      effect:s=>{
        s.flags.cheating=true;
        s.love-=20;
      }
    },
    {
      text:"踏みとどまる",
      effect:s=>{
        s.flags.close=false;
      }
    }
  ]
},

// 発覚
{
  id:"caught",
  priority:100,
  condition:s=>s.flags?.cheating && Math.random()<0.5,
  text:"関係がバレた",
  choices:[
    {
      text:"謝る",
      effect:s=>{
        s.love-=20;
      }
    },
    {
      text:"開き直る",
      effect:s=>{
        s.love-=40;
      }
    }
  ]
},

// 修復 or 崩壊

{
  id:"relationship_break",
  priority:80,

  condition:(s)=>
    s.partner &&
    s.love <= 0,

  text:(s)=> `${s.partner.name}と別れることになった`,

  choices:[
    {
      text:"受け入れる",
      effect:(s)=>{
        s.partner = null;
        s.love = 0;
      }
    }
  ]
},  // ← ★これが超重要（カンマ！！）

{
  id:"relationship_crisis",
  priority:95,

  condition:(s)=>
    s.partner &&
    !s.flags.crisisResolved &&
    s.love < 30,

  text:(s)=> `${s.partner.name}との関係が限界に近い`,

  choices:[
    {
      text:"修復を試みる",
      effect:(s)=>{
        if(Math.random() < 0.5){
          s.love += 20;
          s.flags.crisisResolved = true;
        }else{
          s.love -= 10;
        }
      }
    },
    {
      text:"距離を置く",
      effect:(s)=>{
        s.love -= 5;
        s.flags.crisisResolved = true;
      }
    },
    {
      text:"別れる",
      effect:(s)=>{
        s.partner = null;
        s.love = 0;
      }
    }
  ]
},
  ];

// ======================
// イベント選択
// ======================
function pickEvent(){
  const valid=EVENTS.filter(e=>e.condition(state));
  valid.sort((a,b)=>b.priority-a.priority);
  return valid[0];
}

// ======================
// 死亡判定
// ======================
function checkDeath(){
  if(state.hp<=0) return true;

  let rate=0;
  if(state.age<50) rate=0.001;
  else if(state.age<70) rate=0.01;
  else rate=0.05;{
  id:"relationship_break",
  priority:80,

  condition:(s)=>
    s.partner &&
    s.love <= 0,

  text:(s)=> `${s.partner.name}と別れることになった`,

  choices:[
    {
      text:"受け入れる",
      effect:(s)=>{
        s.partner = null;
        s.love = 0;
      }
    }
  ]
}

  return Math.random()<rate;
}

// ======================
// 実行
// ======================
function run(){

  updatePhase();

  if(checkDeath()){
    document.getElementById("event").innerText="人生を終えた";
    document.getElementById("choices").innerHTML="";
    return;
  }

  const e=pickEvent();

  document.getElementById("event").innerText=
    typeof e.text==="function"?e.text(state):e.text;

  const div=document.getElementById("choices");
  div.innerHTML="";

  e.choices.forEach(c=>{
    const b=document.createElement("button");
    b.innerText=c.text;
    b.onclick=()=>{
      c.effect(state);
      state.age++;
      run();
    };
    div.appendChild(b);
  });

  document.getElementById("status").innerText=
    `年齢:${state.age} 金:${state.money} 愛:${state.love} 子:${state.children} HP:${state.hp}`;
}

// ======================
run();

</script>

</body>
</html>
