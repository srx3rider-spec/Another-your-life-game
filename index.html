<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body {
  background:#0b3d2e;
  color:white;
  font-family:sans-serif;
  padding:20px;
}
.card {
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}
button {
  width:100%;
  padding:12px;
  margin:5px 0;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Another Your Life</h1>

<div id="status" class="card"></div>
<div id="event" class="card"></div>
<div id="choices"></div>

<script>

// ========================
// 状態
// ========================
let state = {
  age: 15,
  money: 50,
  social: 50,
  phase: "student",
  job: null,
  alive: true
};

// ========================
// ステータス表示
// ========================
function renderStatus(){
  document.getElementById("status").innerText =
    `年齢:${state.age} 金:${state.money} 社会:${state.social}`;
}

// ========================
// フェーズ判定
// ========================
function updatePhase(){

  if(state.age <= 12) state.phase = "child";
  else if(state.age <= 18) state.phase = "student";
  else if(state.age <= 22) state.phase = "career";
  else if(state.age <= 30) state.phase = "young";
  else if(state.age <= 60) state.phase = "adult";
  else state.phase = "old";
}

// ========================
// 死亡判定
// ========================
function checkDeath(){

  let rate = 0;

  if(state.age < 50) rate = 0.001;
  else if(state.age < 70) rate = 0.01;
  else if(state.age < 80) rate = 0.05;
  else rate = 0.15;

  return Math.random() < rate;
}

// ========================
// イベント生成
// ========================
function getEvent(){

  // 学生
  if(state.phase === "student"){
    return {
      text: "学校生活、どうする？",
      choices:[
        {text:"勉強する", effect:()=>{state.social+=2}},
        {text:"遊ぶ", effect:()=>{state.social+=1}},
        {text:"恋愛する", effect:()=>{state.social+=3}}
      ]
    };
  }

  // 進路決定（超重要）
  if(state.phase === "career"){
    return {
      text:"進路を決める時期だ",
      choices:[
        {text:"就職する", effect:()=>{state.job="会社員"; state.money+=10}},
        {text:"大学へ進学", effect:()=>{state.money-=10}},
        {text:"フリーターになる", effect:()=>{state.money-=5}},
        {text:"起業する", effect:()=>{state.money+=Math.random()*20-10}}
      ]
    };
  }

  // 若年期
  if(state.phase === "young"){
    return {
      text:"人生が動き出す",
      choices:[
        {text:"仕事に集中", effect:()=>{state.money+=10}},
        {text:"恋愛する", effect:()=>{state.social+=10}},
        {text:"転職する", effect:()=>{state.money+=Math.random()*20-5}}
      ]
    };
  }

  // 成人期
  if(state.phase === "adult"){
    return {
      text:"人生の中盤",
      choices:[
        {text:"安定を取る", effect:()=>{state.money+=5}},
        {text:"挑戦する", effect:()=>{state.money+=20}},
        {text:"家庭優先", effect:()=>{state.social+=10}}
      ]
    };
  }

  // 老後
  if(state.phase === "old"){
    return {
      text:"老後の時間",
      choices:[
        {text:"穏やかに過ごす", effect:()=>{}},
        {text:"趣味に生きる", effect:()=>{state.social+=5}},
        {text:"回想する", effect:()=>{}}
      ]
    };
  }

  return {
    text:"何も起きなかった",
    choices:[
      {text:"次へ", effect:()=>{}}
    ]
  };
}

// ========================
// 選択肢表示
// ========================
function renderChoices(choices){

  const div = document.getElementById("choices");
  div.innerHTML = "";

  choices.forEach(c=>{
    const b = document.createElement("button");
    b.innerText = c.text;

    b.onclick = ()=>{
      c.effect();
      next();
    };

    div.appendChild(b);
  });
}

// ========================
// 次のターン
// ========================
function next(){

  state.age++;

  updatePhase();

  if(checkDeath()){
    document.getElementById("event").innerText = "人生を終えた";
    document.getElementById("choices").innerHTML = "";
    return;
  }

  const e = getEvent();

  document.getElementById("event").innerText = e.text;

  renderChoices(e.choices);
  renderStatus();
}

// ========================
// 初期起動
// ========================
renderStatus();
next();

</script>

</body>
</html>
