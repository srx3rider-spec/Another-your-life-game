<script>

// 状態
let state = {
  age: 15,
  hp: 100,
  happiness: 50,
  alive: true
};

// 画像
function setImage(){
  document.getElementById("image").src =
    "https://picsum.photos/300?random=" + Math.random();
}

// 描画
function draw(){

  setImage();

  if(!state.alive){
    document.getElementById("event").innerText =
      "あなたは" + state.age + "歳で死亡した";
    document.getElementById("choices").innerHTML = "";
    return;
  }

  document.getElementById("status").innerText =
    `年齢:${state.age} HP:${state.hp} 幸福:${state.happiness}`;

  const e = pickEvent();

  document.getElementById("event").innerText = e.text;

  const div = document.getElementById("choices");
  div.innerHTML = "";

  // 🎲 サイコロ
  if(e.dice){
    const btn = document.createElement("button");
    btn.innerText = "🎲 運命に任せる";
    btn.onclick = ()=>{
      const r = Math.random();
      if(r < 0.5){
        e.success(state);
      }else{
        e.fail(state);
      }
      next();
    };
    div.appendChild(btn);
    return;
  }

  // 通常
  e.choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.innerText = c.text;
    btn.onclick = ()=>{
      c.effect(state);
      next();
    };
    div.appendChild(btn);
  });
}

// 次へ
function next(){
  state.age++;

  if(state.hp <= 0){
    state.alive = false;
  }

  draw();
}

// 🔥イベント選択（ここが重要）
function pickEvent(){

  // ★ 20%で強制サイコロ
  if(Math.random() < 0.2){
    return EVENTS.find(e => e.dice);
  }

  const valid = EVENTS.filter(e => !e.condition || e.condition(state));

  return valid[Math.floor(Math.random() * valid.length)];
}

// イベント
const EVENTS = [

  {
    condition: s => s.age < 18,
    text: "学生生活",
    choices: [
      { text:"勉強", effect:s=>{ s.hp-=2; s.happiness-=1 }},
      { text:"遊ぶ", effect:s=>{ s.happiness+=3; s.hp-=1 }}
    ]
  },

  {
    condition: s => s.age >= 18,
    text: "仕事のストレス",
    choices: [
      { text:"頑張る", effect:s=>{ s.hp-=10; s.happiness+=1 }},
      { text:"逃げる", effect:s=>{ s.happiness-=5 }}
    ]
  },

  {
    text: "恋のチャンス",
    choices: [
      { text:"告白", effect:s=>{ s.happiness+=10 }},
      { text:"何もしない", effect:s=>{} }
    ]
  },

  {
    text: "宝くじを見つけた",
    choices: [
      { text:"換金する", effect:s=>{ s.happiness+=20 }},
      { text:"無視する", effect:s=>{} }
    ]
  },

  // 🎲 サイコロ（確実に使う）
  {
    text: "事故が起きた（運命）",
    dice: true,
    success: s => { s.hp -= 20; },
    fail: s => { s.hp -= 5; }
  }

];

// 起動
draw();

</script>
