<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#300;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
.card{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}
button{
  width:100%;
  margin:6px 0;
  padding:12px;
  background:#3b7ddd;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
}
img{
  width:100%;
  height:auto;
  margin-bottom:10px;
  border-radius:8px;
}
</style>

</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="status"></div>
<img id="image" src="">
<div class="card" id="event"></div>
<div id="dice" class="card"></div>
<div id="choices"></div>

<script>

// ===== DOM =====
const statusEl = document.getElementById("status");
const eventEl = document.getElementById("event");
const choicesEl = document.getElementById("choices");
const diceEl = document.getElementById("dice");
const imageEl = document.getElementById("image");

// ===== 状態 =====
let state = {
  age:15,
  hp:100,
  money:50,
  happiness:50
};

// ===== 画像（確実に出る）=====
function setImage(type){
  const map = {
    student: "https://picsum.photos/seed/student/800/400",
    work: "https://picsum.photos/seed/work/800/400",
    love: "https://picsum.photos/seed/love/800/400",
    money: "https://picsum.photos/seed/money/800/400",
    accident: "https://picsum.photos/seed/accident/800/400"
  };
  imageEl.src = map[type] || "https://picsum.photos/800/400";
}

// ===== 表示 =====
function updateStatus(){
  statusEl.innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== 次へ =====
function next(){

  // 死亡 or 終了
  if(state.hp <= 0){
    eventEl.innerText="💀 死亡";
    choicesEl.innerHTML="";
    diceEl.innerText="";
    return;
  }

  if(state.age >= 80){
    eventEl.innerText="🏁 人生を全うした";
    choicesEl.innerHTML="";
    diceEl.innerText="";
    return;
  }

  state.age++;

  // ===== 学生フェーズ =====
  if(state.age < 18){
    setImage("student");
    eventEl.innerText="学校生活";

    diceEl.innerText="";
    choicesEl.innerHTML="";

    addChoice("勉強", ()=>{
      state.happiness += 2;
      proceed();
    });

    addChoice("遊ぶ", ()=>{
      state.hp -= 5;
      state.happiness += 5;
      proceed();
    });

    updateStatus();
    return;
  }

  // ===== ランダムイベント =====
  const r = Math.random();

  // ===== サイコロイベント =====
  if(r < 0.3){

    setImage("money");
    eventEl.innerText="宝くじを拾った";

    choicesEl.innerHTML="";
    diceEl.innerText="";

    addChoice("🎲 運命に任せる", ()=>{

      const d = Math.floor(Math.random()*6)+1;

      if(d <= 2){
        diceEl.innerText="🎲 ハズレ";
      } else if(d <=4){
        state.money += 20;
        diceEl.innerText="🎲 小当たり";
      } else {
        state.money += 100;
        state.happiness += 10;
        diceEl.innerText="🎲 大当たり！";
      }

      updateStatus();

      // ★ 1回で終わる（ループ防止）
      setTimeout(()=>{
        diceEl.innerText="";
        proceed();
      },1000);
    });

    updateStatus();
    return;
  }

  // ===== 通常イベント =====
  const events = [
    {text:"仕事がつらい", type:"work", hp:-10, money:+30},
    {text:"恋人とデート", type:"love", hp:+5, happiness:+10},
    {text:"副業が成功した", type:"money", money:+50},
    {text:"事故にあった", type:"accident", hp:-20}
  ];

  const e = events[Math.floor(Math.random()*events.length)];

  setImage(e.type);
  eventEl.innerText = e.text;

  diceEl.innerText="";
  choicesEl.innerHTML="";

  addChoice("対応する", ()=>{
    state.hp += (e.hp || 0);
    state.money += (e.money || 0);
    state.happiness += (e.happiness || 0);
    proceed();
  });

  addChoice("無視する", ()=>{
    proceed();
  });

  updateStatus();
}

// ===== 共通進行 =====
function proceed(){
  next();
}

// ===== ボタン =====
function addChoice(text,fn){
  const btn = document.createElement("button");
  btn.innerText=text;
  btn.onclick=fn;
  choicesEl.appendChild(btn);
}

// ===== 起動 =====
updateStatus();
next();

</script>

</body>
</html>
