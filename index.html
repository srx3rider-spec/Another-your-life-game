<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#300;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
.card{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}
button{
  width:100%;
  margin:5px 0;
  padding:10px;
  background:#3b7ddd;
  color:#fff;
  border:none;
  border-radius:8px;
}
img{
  width:100%;
  margin-bottom:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<!-- 初期画面 -->
<div id="start" class="card">
  <p>人生を開始しますか？</p>
  <button id="startBtn">スタート</button>
</div>

<!-- ゲーム -->
<div id="game" style="display:none;">
  <div class="card" id="status"></div>
  <img id="image">
  <div class="card" id="event"></div>
  <div id="choices"></div>
</div>

<script>

// ===== DOMキャッシュ（これ重要） =====
const startDiv = document.getElementById("start");
const gameDiv = document.getElementById("game");
const statusDiv = document.getElementById("status");
const eventDiv = document.getElementById("event");
const choicesDiv = document.getElementById("choices");
const imageEl = document.getElementById("image");

// ===== 状態 =====
let state;

// ===== スタート =====
document.getElementById("startBtn").onclick = () => {
  state = {
    age:3,
    hp:100,
    money:50,
    happiness:50,
    hasPartner:false
  };

  startDiv.style.display="none";
  gameDiv.style.display="block";

  next();
};

// ===== 画像 =====
function setImage(keyword){
  imageEl.src = "https://picsum.photos/seed/"+keyword+"/800/400";
}

// ===== 表示 =====
function updateStatus(){
  statusDiv.innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== メイン =====
function next(){

  if(state.hp<=0){
    eventDiv.innerText="💀 死亡";
    choicesDiv.innerHTML="";
    return;
  }

  state.age++;

  let e;

  if(state.age < 6){
    e={
      text:"おもちゃが欲しい",
      img:"toy",
      choices:[
        {text:"買う", fn:()=>{state.money-=10;state.happiness+=10;next();}},
        {text:"我慢", fn:()=>{state.happiness-=2;next();}}
      ]
    };
  }

  else if(state.age < 18){
    e={
      text:"勉強する？",
      img:"school",
      choices:[
        {text:"勉強", fn:()=>{state.happiness+=2;next();}},
        {text:"遊ぶ", fn:()=>{state.hp-=5;state.happiness+=5;next();}}
      ]
    };
  }

  else if(!state.hasPartner && Math.random()<0.4){
    e={
      text:"素敵な人と出会った",
      img:"love",
      choices:[
        {text:"付き合う", fn:()=>{state.hasPartner=true;state.happiness+=10;next();}},
        {text:"見送る", fn:()=>{next();}}
      ]
    };
  }

  else if(state.hasPartner && Math.random()<0.5){
    e={
      text:"恋人とデート",
      img:"date",
      choices:[
        {text:"楽しむ", fn:()=>{state.happiness+=15;next();}},
        {text:"仕事優先", fn:()=>{state.money+=20;state.happiness-=5;next();}}
      ]
    };
  }

  else if(Math.random()<0.2){
    e={
      text:"事故にあった",
      img:"accident",
      choices:[
        {text:"治療", fn:()=>{state.hp+=10;state.money-=20;next();}},
        {text:"放置", fn:()=>{state.hp-=15;next();}}
      ]
    };
  }

  else{
    e={
      text:"仕事がつらい",
      img:"office",
      choices:[
        {text:"頑張る", fn:()=>{state.money+=30;state.hp-=10;next();}},
        {text:"休む", fn:()=>{state.hp+=10;next();}}
      ]
    };
  }

  // ===== 描画 =====
  setImage(e.img);
  eventDiv.innerText=e.text;
  choicesDiv.innerHTML="";

  e.choices.forEach(c=>{
    const btn=document.createElement("button");
    btn.innerText=c.text;
    btn.onclick=c.fn;
    choicesDiv.appendChild(btn);
  });

  updateStatus();
}

</script>

</body>
</html>
