<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Another Your Life</title>

<style>
body{
 background:#111;color:#fff;font-family:sans-serif;padding:20px;
}
.card{
 background:#1c1c1c;padding:20px;border-radius:12px;margin:10px 0;
}
button{
 width:100%;padding:14px;margin:6px 0;
 border:none;border-radius:8px;background:#2d7ef7;color:#fff;
}
.bad{background:#400;}
.good{background:#042;}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="setup">
<h3>あなたの名前</h3>
<input id="name" placeholder="例：太郎" style="width:100%;padding:12px">
<button onclick="startGame()">開始</button>
</div>

<div class="card" id="stats"></div>
<div class="card" id="event">人生が始まる...</div>
<div id="choices"></div>

<button onclick="share()">シェア</button>

<audio id="bgmLight" src="" loop></audio>
<audio id="bgmDark" src="" loop></audio>

<script>
function startGame(){
  state.name = document.querySelector("input").value;

  document.getElementById("setup").style.display="none";
  document.getElementById("stats").style.display="block";
  document.getElementById("event").style.display="block";

  nextEvent();
}
let state={
 name:"",
 age:18,
 money:50,
 social:50,
 luck:50,
 history:[],
 energy:10
};



function updateStats(e){
 for(let k in e){
  state[k]+=e[k];
 }
}

function renderStats(){
 document.getElementById("stats").innerText=
 `${state.name}｜年齢:${state.age} 資産:${state.money} 社会:${state.social}`;
}

function renderChoices(arr){
 const div=document.getElementById("choices");
 div.innerHTML="";

 arr.forEach(o=>{
  const b=document.createElement("button");
  b.innerText=o.text;
  b.onclick=()=>{
   state.history.push(o.text);
   updateStats(o.effect);
   nextEvent();
  };
  div.appendChild(b);
 });
}

async function nextEvent(){

  state.age+=3;

  document.getElementById("event").innerText="人生を生成中...";

  const r = await fetch("/api/event",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(state)
  });

  const e = await r.json();

  document.getElementById("event").innerText = e.event;

  renderChoices(e.choices);
  renderStats();

  if(e.tone==="bad"){
    document.body.className="bad";
  }else{
    document.body.className="good";
  }
}
