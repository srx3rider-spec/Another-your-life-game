<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#400;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}

.card{
  background:#222;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

button{
  display:block;
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3b7ddd;
  color:#fff;
  cursor:pointer;
}

button:hover{ background:#5a95ff; }

img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

#dice{
  font-size:30px;
  text-align:center;
  margin:10px;
}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="status"></div>
<img id="image">
<div class="card" id="event"></div>
<div id="dice"></div>
<div id="choices"></div>

<script>

// ===== 状態 =====
let state = {
  age: 15,
  hp: 100,
  money: 50,
  happiness: 50
};

// ===== イベント =====
const EVENTS = [

  // 学生
  {
    type:"student",
    text:"勉強する？",
    choices:[
      {text:"勉強", effect:s=>{s.happiness-=2;}},
      {text:"遊ぶ", effect:s=>{s.happiness+=5; s.hp-=3;}}
    ]
  },

  // 恋愛
  {
    type:"love",
    text:"気になる人がいる",
    choices:[
      {text:"告白", effect:s=>{s.happiness+=15;}},
      {text:"やめる", effect:s=>{s.happiness-=5;}}
    ]
  },

  // 仕事
  {
    type:"work",
    text:"仕事のストレス",
    choices:[
      {text:"頑張る", effect:s=>{s.money+=20; s.hp-=10;}},
      {text:"サボる", effect:s=>{s.hp+=5;}}
    ]
  },

  // 宝くじ（サイコロ）
  {
    type:"money",
    dice:true,
    text:"宝くじを見つけた",
    resolve:(roll,s)=>{
      if(roll<=2){ s.money-=10; return "ハズレ"; }
      if(roll<=4){ s.money+=10; return "ちょい当たり"; }
      s.money+=100; return "大当たり!!";
    }
  },

  // 事故（サイコロ）
  {
    type:"accident",
    dice:true,
    text:"事故が起きた",
    resolve:(roll,s)=>{
      if(roll<=2){ s.hp-=50; return "重傷"; }
      if(roll<=4){ s.hp-=20; return "軽傷"; }
      return "無傷！";
    }
  }
];

// ===== 画像 =====
function setImage(type){
  const map = {
    student:"school classroom",
    love:"romantic couple",
    work:"office stress",
    money:"money cash",
    accident:"car accident"
  };

  const keyword = map[type] || "life";

  document.getElementById("image").src =
    "https://source.unsplash.com/800x500/?"+encodeURIComponent(keyword);
}

// ===== 状態表示 =====
function updateStatus(){
  document.getElementById("status").innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== イベント選択 =====
function pickEvent(){
  if(state.age < 18){
    return EVENTS.filter(e=>e.type==="student"||e.type==="love");
  }
  if(state.age < 60){
    return EVENTS.filter(e=>e.type!=="student");
  }
  return EVENTS;
}

// ===== メイン =====
function next(){

  if(state.hp<=0 || state.age>80){
    document.getElementById("event").innerText="人生終了";
    document.getElementById("choices").innerHTML="";
    return;
  }

  state.age++;

  const pool = pickEvent();
  const e = pool[Math.floor(Math.random()*pool.length)];

  setImage(e.type);
  document.getElementById("event").innerText = e.text;

  const choicesDiv = document.getElementById("choices");
  const diceDiv = document.getElementById("dice");

  choicesDiv.innerHTML="";
  diceDiv.innerText="";

  // ===== サイコロ =====
  if(e.dice){
    const btn = document.createElement("button");
    btn.innerText="🎲 運命に任せる";
    btn.onclick=()=>{
      const roll = Math.floor(Math.random()*6)+1;
      const result = e.resolve(roll,state);
      diceDiv.innerText = `🎲 ${roll} → ${result}`;
      updateStatus();
    };
    choicesDiv.appendChild(btn);
    return;
  }

  // ===== 通常選択 =====
  e.choices.forEach(c=>{
    const btn=document.createElement("button");
    btn.innerText=c.text;
    btn.onclick=()=>{
      c.effect(state);
      updateStatus();
      next();
    };
    choicesDiv.appendChild(btn);
  });
}

// ===== 初期 =====
updateStatus();
next();

</script>

</body>
</html>
