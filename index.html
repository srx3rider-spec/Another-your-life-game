<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{background:#300;color:#fff;font-family:sans-serif;padding:20px;max-width:600px;margin:auto;}
.card{background:#222;padding:15px;margin-bottom:10px;border-radius:10px;}
button{width:100%;margin:5px 0;padding:10px;background:#3b7ddd;color:#fff;border:none;border-radius:8px;}
img{width:100%;margin-bottom:10px;border-radius:10px;}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div class="card">
  <button onclick="startGame()">人生スタート</button>
</div>

<div id="game" style="display:none;">
  <div class="card" id="status"></div>
  <img id="image">
  <div class="card" id="event"></div>
  <div id="choices"></div>
</div>

<div class="card">
  <h3>後悔分岐</h3>
  <input id="branchAge" placeholder="年齢 (例:18)">
  <button onclick="branch()">別の人生を見る</button>
</div>

<script>

// ===== 状態 =====
let state;
let history = [];

// ===== 画像 =====
function setImage(type){
  document.getElementById("image").src =
    "https://picsum.photos/seed/"+type+"/800/400";
}

// ===== ステータス =====
function updateStatus(){
  status.innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== スタート =====
function startGame(){
  state = {
    age:3,
    hp:100,
    money:50,
    happiness:50,
    hasPartner:false,
    lastEvent:null
  };
  history = [];
  game.style.display="block";
  next();
}

// ===== イベント =====
const events = [

  {
    id:"toy",
    text:"おもちゃを欲しがっている",
    type:"child",
    condition:s=>s.age<6,
    choices:[
      {text:"買う", effect:s=>{s.happiness+=10;s.money-=10}},
      {text:"我慢", effect:s=>{s.happiness-=3}}
    ]
  },

  {
    id:"study",
    text:"勉強する？",
    type:"student",
    condition:s=>s.age<18,
    choices:[
      {text:"勉強", effect:s=>{s.happiness+=2}},
      {text:"遊ぶ", effect:s=>{s.hp-=5;s.happiness+=5}}
    ]
  },

  {
    id:"love",
    text:"恋人と出会った",
    type:"love",
    condition:s=>!s.hasPartner && s.age>=18,
    choices:[
      {text:"付き合う", effect:s=>{s.hasPartner=true;s.happiness+=10}},
      {text:"スルー", effect:s=>{s.happiness-=2}}
    ]
  },

  {
    id:"date",
    text:"恋人とデート",
    type:"love",
    condition:s=>s.hasPartner,
    choices:[
      {text:"楽しむ", effect:s=>{s.happiness+=15}},
      {text:"仕事優先", effect:s=>{s.money+=20;s.happiness-=5}}
    ]
  },

  {
    id:"work",
    text:"仕事がつらい",
    type:"work",
    condition:s=>s.age>=18,
    choices:[
      {text:"頑張る", effect:s=>{s.money+=30;s.hp-=10}},
      {text:"休む", effect:s=>{s.hp+=10}}
    ]
  },

  {
    id:"accident",
    text:"事故にあった",
    type:"accident",
    condition:s=>true,
    choices:[
      {text:"治療", effect:s=>{s.hp+=10;s.money-=20}},
      {text:"放置", effect:s=>{s.hp-=15}}
    ]
  }

];

// ===== 抽選 =====
function pickEvent(){
  let list = events.filter(e=>e.condition(state));
  list = list.filter(e=>e.id!==state.lastEvent);
  const e = list[Math.floor(Math.random()*list.length)];
  state.lastEvent = e.id;
  return e;
}

// ===== メイン =====
function next(){

  if(state.hp<=0){
    event.innerText="💀 死亡";
    choices.innerHTML="";
    return;
  }

  state.age++;

  const e = pickEvent();

  setImage(e.type);
  event.innerText = e.text;
  choices.innerHTML="";

  e.choices.forEach(c=>{
    const btn=document.createElement("button");
    btn.innerText=c.text;

    btn.onclick=()=>{
      // 履歴保存（超重要）
      history.push({
        age:state.age,
        event:e.id,
        choice:c.text,
        snapshot:JSON.parse(JSON.stringify(state))
      });

      c.effect(state);
      next();
    };

    choices.appendChild(btn);
  });

  updateStatus();
}

// ===== 分岐 =====
function branch(){

  const targetAge = parseInt(branchAge.value);

  const point = history.find(h=>h.age>=targetAge);

  if(!point){
    alert("その年齢のデータがない");
    return;
  }

  let sim = JSON.parse(JSON.stringify(point.snapshot));

  // 別選択（逆にする）
  sim.hasPartner = !sim.hasPartner;
  sim.happiness -= 10;

  let log = [];

  for(let i=0;i<10;i++){
    const e = events[Math.floor(Math.random()*events.length)];
    log.push(e.text);
    e.choices[0].effect(sim);
  }

  // ===== 比較 =====
  alert(
`▼元の人生
金:${state.money} 幸福:${state.happiness}

▼別の人生
金:${sim.money} 幸福:${sim.happiness}

--- 分岐後の出来事 ---
${log.join("\n")}
`);
}

</script>

</body>
</html>
