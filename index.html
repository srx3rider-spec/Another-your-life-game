<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#400;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}

.card{
  background:#222;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

button{
  display:block;
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3b7ddd;
  color:#fff;
  cursor:pointer;
}
button:hover{ background:#5a95ff; }

img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

#dice{
  font-size:22px;
  text-align:center;
  margin:10px;
}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="status"></div>
<img id="image">
<div class="card" id="event"></div>
<div id="dice"></div>
<div id="choices"></div>

<script>

// ===== 状態 =====
let state = {
  age:15,
  hp:100,
  money:50,
  happiness:50
};

// ===== イベント =====
const EVENTS = [

  // 学生
  {
    type:"student",
    text:"勉強する？",
    choices:[
      {text:"勉強", effect:s=>{s.happiness-=2;}},
      {text:"遊ぶ", effect:s=>{s.happiness+=5; s.hp-=3;}}
    ]
  },

  // 恋愛
  {
    type:"love",
    text:"気になる人がいる",
    choices:[
      {text:"告白", effect:s=>{s.happiness+=15;}},
      {text:"やめる", effect:s=>{s.happiness-=5;}}
    ]
  },

  // 仕事
  {
    type:"work",
    text:"仕事のストレス",
    choices:[
      {text:"頑張る", effect:s=>{s.money+=20; s.hp-=10;}},
      {text:"サボる", effect:s=>{s.hp+=5;}}
    ]
  },

  // 宝くじ（サイコロ）
  {
    type:"money",
    dice:true,
    text:"宝くじを見つけた",
    resolve:(roll,s)=>{
      if(roll<=2){ s.money-=10; return "ハズレ"; }
      if(roll<=4){ s.money+=10; return "小当たり"; }
      s.money+=100; return "大当たり!!";
    }
  },

  // 事故（サイコロ）
  {
    type:"accident",
    dice:true,
    text:"事故が起きた",
    resolve:(roll,s)=>{
      if(roll<=2){ s.hp-=50; return "重傷"; }
      if(roll<=4){ s.hp-=20; return "軽傷"; }
      return "無傷！";
    }
  }

];

// ===== 画像（安定＆意味付き） =====
function setImage(type){

  const map = {
    student:"school",
    love:"couple",
    work:"office",
    money:"money",
    accident:"accident"
  };

  const key = map[type] || "life";

  // ランダムだけど「ジャンル固定」
  document.getElementById("image").src =
    "https://picsum.photos/seed/"+key+Math.random()+"/800/400";
}

// ===== ステータス表示 =====
function updateStatus(){
  document.getElementById("status").innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== イベント抽出 =====
function pickEvent(){

  if(state.age < 18){
    return EVENTS.filter(e=>e.type==="student" || e.type==="love");
  }

  if(state.age < 60){
    return EVENTS.filter(e=>e.type!=="student");
  }

  return EVENTS;
}

// ===== メイン進行 =====
function next(){

  if(state.hp <= 0 || state.age > 80){
    document.getElementById("event").innerText = "人生終了";
    document.getElementById("choices").innerHTML = "";
    document.getElementById("dice").innerText = "";
    return;
  }

  state.age++;

  const pool = pickEvent();
  const e = pool[Math.floor(Math.random()*pool.length)];

  setImage(e.type);
  document.getElementById("event").innerText = e.text;

  const choices = document.getElementById("choices");
  const dice = document.getElementById("dice");

  choices.innerHTML = "";
  dice.innerText = "";

  // ===== サイコロイベント =====
  if(e.dice){

    const btn = document.createElement("button");
    btn.innerText = "🎲 運命に任せる";

    btn.onclick = () => {

      const roll = Math.floor(Math.random()*6)+1;
      const result = e.resolve(roll, state);

      dice.innerText = `🎲 ${roll} → ${result}`;

      updateStatus();

      // ★ここでちゃんと進む
      setTimeout(next, 1200);
    };

    choices.appendChild(btn);
    return;
  }

  // ===== 通常選択 =====
  e.choices.forEach(c=>{

    const btn = document.createElement("button");
    btn.innerText = c.text;

    btn.onclick = () => {
      c.effect(state);
      updateStatus();
      next();
    };

    choices.appendChild(btn);
  });
}

// ===== 初期 =====
updateStatus();
next();

</script>

</body>
</html>
