<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>
<style>
body{
  background:#0b3d2e;
  color:white;
  font-family:sans-serif;
  padding:20px;
}
.box{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
}
button{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#3b82f6;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Another Your Life</h1>

<div id="status" class="box"></div>
<div id="event" class="box"></div>
<div id="choices"></div>

<script>

// ======================
// STATE
// ======================
let state = {
  age:15,
  money:50,
  love:0,
  children:0,
  partner:null,
  married:false,
  job:null,
  phase:"student"
};

// ======================
function updatePhase(){
  if(state.age<18) state.phase="student";
  else if(state.age<23) state.phase="career";
  else state.phase="adult";
}

// ======================
function createPartner(){
  const names=["あや","ゆい","さき"];
  return {name:names[Math.floor(Math.random()*names.length)]};
}

// ======================
const EVENTS=[

{
  id:"start",
  priority:100,
  condition:s=>s.age===15,
  text:"これからの人生をどうする？",
  choices:[
    {text:"勉強する",effect:s=>{s.money+=5}},
    {text:"遊ぶ",effect:s=>{s.love+=5}}
  ]
},

{
  id:"meet",
  priority:50,
  condition:s=>!s.partner && s.age>=18,
  text:"気になる人と出会った",
  choices:[
    {text:"話す",effect:s=>{s.partner=createPartner(); s.love=30}},
    {text:"無視",effect:s=>{}}
  ]
},

{
  id:"love",
  priority:40,
  condition:s=>s.partner && !s.married,
  text:s=>`${s.partner.name}と過ごしている`,
  choices:[
    {text:"デート",effect:s=>{s.love+=10}},
    {text:"放置",effect:s=>{s.love-=10}}
  ]
},

{
  id:"marry",
  priority:60,
  condition:s=>s.partner && s.love>=80 && !s.married,
  text:"結婚する？",
  choices:[
    {text:"結婚",effect:s=>{s.married=true}},
    {text:"やめる",effect:s=>{}}
  ]
},

{
  id:"child",
  priority:55,
  condition:s=>s.married && s.children===0 && Math.random()<0.3,
  text:"子供が生まれた",
  choices:[
    {text:"育てる",effect:s=>{s.children++}},
    {text:"放置",effect:s=>{}}
  ]
},

{
  id:"career",
  priority:45,
  condition:s=>s.phase==="career" && !s.job,
  text:"進路を決める",
  choices:[
    {text:"就職",effect:s=>{s.job="会社員"; s.money+=10}},
    {text:"フリーター",effect:s=>{s.money-=5}}
  ]
},

{
  id:"work",
  priority:20,
  condition:s=>s.job==="会社員",
  text:"仕事の日",
  choices:[
    {text:"働く",effect:s=>{s.money+=5}},
    {text:"サボる",effect:s=>{}}
  ]
},

{
  id:"daily",
  priority:1,
  condition:s=>true,
  text:"日常",
  choices:[
    {text:"過ごす",effect:s=>{}}
  ]
}

];

// ======================
function pickEvent(){
  const valid=EVENTS.filter(e=>e.condition(state));
  valid.sort((a,b)=>b.priority-a.priority);
  return valid[0];
}

// ======================
function run(){

  updatePhase();

  const e=pickEvent();

  document.getElementById("event").innerText=
    typeof e.text==="function"?e.text(state):e.text;

  const div=document.getElementById("choices");
  div.innerHTML="";

  e.choices.forEach(c=>{
    const b=document.createElement("button");
    b.innerText=c.text;
    b.onclick=()=>{
      c.effect(state);
      state.age++;
      run();
    };
    div.appendChild(b);
  });

  document.getElementById("status").innerText=
    `年齢:${state.age} 金:${state.money} 愛:${state.love} 子:${state.children}`;
}

// ======================
run();

</script>

</body>
</html>
