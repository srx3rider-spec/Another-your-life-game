<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>
</head>
<body>

<h1>Another Your Life</h1>

<div id="status"></div>
<img id="image" width="300">
<div id="event"></div>
<div id="choices"></div>

<script>
let state = {
  age: 15,
  hp: 100,
  happiness: 50,
  alive: true
};

function setImage(word){
  document.getElementById("image").src =
    "https://picsum.photos/300?random=" + Math.random();
}

function draw(){
  if(!state.alive){
    document.getElementById("event").innerText =
      "あなたは" + state.age + "歳で死亡した";
    document.getElementById("choices").innerHTML = "";
    return;
  }

  document.getElementById("status").innerText =
    `年齢:${state.age} HP:${state.hp} 幸福:${state.happiness}`;

  let e = pickEvent();

  document.getElementById("event").innerText = e.text;

  let div = document.getElementById("choices");
  div.innerHTML = "";

  if(e.dice){
    let btn = document.createElement("button");
    btn.innerText = "🎲 サイコロを振る";
    btn.onclick = ()=>{
      let r = Math.random();
      if(r < 0.5){
        e.success(state);
      }else{
        e.fail(state);
      }
      next();
    };
    div.appendChild(btn);
    return;
  }

  e.choices.forEach(c=>{
    let btn = document.createElement("button");
    btn.innerText = c.text;
    btn.onclick = ()=>{
      c.effect(state);
      next();
    };
    div.appendChild(btn);
  });
}

function next(){
  state.age++;

  if(state.hp <= 0){
    state.alive = false;
  }

  draw();
}

function pickEvent(){
  let valid = EVENTS.filter(e=> !e.condition || e.condition(state));
  return valid[Math.floor(Math.random()*valid.length)];
}

const EVENTS = [

  {
    condition: s => s.age < 18,
    text: "学生生活",
    choices: [
      {text:"勉強", effect:s=>{s.happiness-=2; s.hp-=1}},
      {text:"遊ぶ", effect:s=>{s.happiness+=3; s.hp-=1}}
    ]
  },

  {
    condition: s => s.age >= 18,
    text: "仕事のストレス",
    choices: [
      {text:"頑張る", effect:s=>{s.hp-=10; s.happiness+=1}},
      {text:"逃げる", effect:s=>{s.happiness-=5}}
    ]
  },

  {
    text: "事故が起きた（運命）",
    dice: true,
    success: s => {
      s.hp -= 50;
      setImage("accident");
    },
    fail: s => {
      s.hp -= 10;
      setImage("safe");
    }
  }

];

draw();
</script>

</body>
</html>
