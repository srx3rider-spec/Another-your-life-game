<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Another Your Life</title>

<style>
body{
  background:#111;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}

h2{margin-bottom:20px;}

.card{
  background:#1c1c1c;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#3b82f6;
  color:white;
  font-size:16px;
}

.good{ background:#042; }
.bad{ background:#400; }
</style>

</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="setup">
  あなたの名前
  <input id="name" placeholder="例：田中">
  <button onclick="startGame()">開始</button>
</div>

<div class="card" id="stats" style="display:none;"></div>
<div class="card" id="event" style="display:none;">人生が始まる...</div>
<div id="choices"></div>

<button onclick="share()">シェア</button>

<script>

let state={
  name:"",
  age:18,
  money:50,
  social:50,
  luck:50,
  history:[]
};

window.startGame = function(){

  state.name = document.getElementById("name").value || "あなた";

  document.getElementById("setup").style.display="none";
  document.getElementById("stats").style.display="block";
  document.getElementById("event").style.display="block";

  nextEvent();
}

function renderStats(){
  document.getElementById("stats").innerText =
    `${state.name}｜年齢:${state.age} 資産:${state.money} 社会:${state.social}`;
}

function renderChoices(arr){
  const div=document.getElementById("choices");
  div.innerHTML="";

  arr.forEach(o=>{
    const b=document.createElement("button");
    b.innerText=o.text;
    b.onclick=()=>{
      updateStats(o.effect);
      nextEvent();
    };
    div.appendChild(b);
  });
}

function updateStats(e){
  for(let k in e){
    state[k]+=e[k];
  }
}

async function nextEvent(){

  state.age += 3;

  document.getElementById("event").innerText="人生生成中...";

  try{
    const r = await fetch("/api/event",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(state)
    });

    const e = await r.json();

    document.getElementById("event").innerText = e.event;

    renderChoices(e.choices);
    renderStats();

    document.body.className = e.tone==="bad" ? "bad" : "good";

  }catch{
    document.getElementById("event").innerText = "エラー発生";
  }
}

function share(){
  alert(`${state.name}の人生｜資産:${state.money}`);
}

</script>

</body>
</html>
