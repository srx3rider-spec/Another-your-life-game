<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#300;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
.card{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}
button{
  width:100%;
  margin:5px 0;
  padding:12px;
  background:#3b7ddd;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
}
img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div id="start" class="card">
  <p>人生を開始する</p>
  <button onclick="startGame()">スタート</button>
</div>

<div id="game" style="display:none;">
  <div class="card" id="status"></div>
  <img id="image">
  <div class="card" id="event"></div>
  <div id="choices"></div>
</div>

<script>

// ===== 状態 =====
let state;

// ===== スタート =====
function startGame(){
  state = {
    age:3,
    hp:100,
    money:50,
    happiness:50,
    study:0,
    stress:0,
    love:0,
    injured:false,
    job:null
  };

  document.getElementById("start").style.display="none";
  document.getElementById("game").style.display="block";

  next();
}

// ===== DOM =====
const statusEl = document.getElementById("status");
const eventEl = document.getElementById("event");
const choicesEl = document.getElementById("choices");
const imageEl = document.getElementById("image");

// ===== 画像 =====
function setImage(type){
  imageEl.src = "https://picsum.photos/seed/"+type+"/800/400";
}

// ===== 表示 =====
function updateStatus(){
  statusEl.innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== メイン =====
function next(){

  if(state.hp <= 0){
    setImage("death");
    eventEl.innerText = "💀 人生終了";
    choicesEl.innerHTML = "";
    return;
  }

  state.age++;

  let e;

  // ===== 幼少 =====
  if(state.age < 6){
    e = {
      text:"おもちゃが欲しい",
      img:"toy",
      choices:[
        {text:"買う", fn:()=>{state.money-=10;state.happiness+=10;next();}},
        {text:"我慢", fn:()=>{state.stress+=5;next();}}
      ]
    };
  }

  // ===== 学生 =====
  else if(state.age < 18){
    e = {
      text:"勉強する？",
      img:"school",
      choices:[
        {text:"勉強", fn:()=>{state.study+=10;state.stress+=5;next();}},
        {text:"遊ぶ", fn:()=>{state.happiness+=10;state.study-=3;next();}}
      ]
    };
  }

  // ===== 就職分岐 =====
  else if(state.age === 18){
    if(state.study > 50){
      state.job = "good";
      e = {
        text:"良い会社に就職した",
        img:"office",
        choices:[
          {text:"働く", fn:()=>{state.money+=50;next();}}
        ]
      };
    }else{
      state.job = "bad";
      e = {
        text:"仕事が見つからない",
        img:"jobless",
        choices:[
          {text:"バイト", fn:()=>{state.money+=20;state.stress+=10;next();}}
        ]
      };
    }
  }

  // ===== 恋愛 =====
  else if(!state.love && Math.random()<0.3){
    e = {
      text:"恋に出会った",
      img:"couple",
      choices:[
        {text:"付き合う", fn:()=>{state.love=1;state.happiness+=20;next();}},
        {text:"やめる", fn:()=>{next();}}
      ]
    };
  }

  // ===== 恋人ありイベント =====
  else if(state.love && Math.random()<0.4){
    e = {
      text:"恋人と過ごす",
      img:"date",
      choices:[
        {text:"優先する", fn:()=>{state.happiness+=15;state.money-=10;next();}},
        {text:"仕事優先", fn:()=>{state.money+=20;state.happiness-=5;next();}}
      ]
    };
  }

  // ===== ストレス事故 =====
  else if(state.stress > 40 && Math.random()<0.5){
    state.injured = true;

    e = {
      text:"ストレスで事故にあった",
      img:"accident",
      choices:[
        {text:"治療", fn:()=>{state.hp+=10;state.money-=30;state.injured=false;next();}},
        {text:"放置", fn:()=>{state.hp-=20;next();}}
      ]
    };
  }

  // ===== ケガ継続 =====
  else if(state.injured){
    e = {
      text:"体調が悪い",
      img:"hospital",
      choices:[
        {text:"治療する", fn:()=>{state.hp+=15;state.money-=20;state.injured=false;next();}},
        {text:"我慢", fn:()=>{state.hp-=10;next();}}
      ]
    };
  }

  // ===== 通常仕事 =====
  else{
    if(state.job === "good"){
      e = {
        text:"仕事は順調",
        img:"business",
        choices:[
          {text:"頑張る", fn:()=>{state.money+=40;state.stress+=10;next();}},
          {text:"休む", fn:()=>{state.hp+=10;next();}}
        ]
      };
    }else{
      e = {
        text:"生活が苦しい",
        img:"poor",
        choices:[
          {text:"働く", fn:()=>{state.money+=20;state.hp-=5;next();}},
          {text:"休む", fn:()=>{state.hp+=5;next();}}
        ]
      };
    }
  }

  // ===== 描画 =====
  setImage(e.img);
  eventEl.innerText = e.text;
  choicesEl.innerHTML = "";

  e.choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.innerText = c.text;
    btn.onclick = c.fn;
    choicesEl.appendChild(btn);
  });

  updateStatus();
}

</script>

</body>
</html>
