<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#300;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
.card{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}
button{
  width:100%;
  margin:5px 0;
  padding:10px;
  background:#3b7ddd;
  color:#fff;
  border:none;
  border-radius:8px;
}
img{
  width:100%;
  margin-bottom:10px;
}
</style>

</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="status">読み込み中...</div>
<img id="image">
<div class="card" id="event">読み込み中...</div>
<div id="dice"></div>
<div id="choices"></div>

<script>

// ===== 状態 =====
let state = {
  age:15,
  hp:100,
  money:50,
  happiness:50
};

// ===== 画像 =====
function setImage(type){
  const map={
    student:"school",
    work:"office",
    love:"couple",
    money:"money",
    accident:"accident"
  };

  const key = map[type] || "life";

  document.getElementById("image").src =
    "https://source.unsplash.com/800x400/?"+key;
}

// ===== 表示 =====
function updateStatus(){
  document.getElementById("status").innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== メイン =====
function next(){

  // 死亡判定
  if(state.hp <= 0){
    document.getElementById("event").innerText="💀 死亡";
    document.getElementById("choices").innerHTML="";
    return;
  }

  state.age++;

  const r = Math.random();

  // ===== 学生 =====
  if(state.age < 18){

    setImage("student");
    event.innerText="勉強する？";

    choices.innerHTML="";

    addChoice("勉強",()=>{
      state.happiness+=2;
      next();
    });

    addChoice("遊ぶ",()=>{
      state.hp-=5;
      state.happiness+=5;
      next();
    });

    updateStatus();
    return;
  }

  // ===== サイコロイベント =====
  if(r < 0.3){

    setImage("money");
    event.innerText="宝くじを拾った";
    choices.innerHTML="";
    dice.innerText="";

    addChoice("🎲 運命に任せる",()=>{

      const d = Math.floor(Math.random()*6)+1;

      if(d <= 2){
        dice.innerText="ハズレ";
      }else if(d <=4){
        state.money+=20;
        dice.innerText="小当たり";
      }else{
        state.money+=100;
        dice.innerText="大当たり！";
      }

      updateStatus();

      setTimeout(()=>{
        dice.innerText="";
        next();
      },1000);
    });

    updateStatus();
    return;
  }

  // ===== 通常イベント =====
  setImage("work");
  event.innerText="仕事がつらい";

  choices.innerHTML="";

  addChoice("頑張る",()=>{
    state.money+=30;
    state.hp-=10;
    next();
  });

  addChoice("休む",()=>{
    state.hp+=10;
    next();
  });

  updateStatus();
}

// ===== ボタン生成 =====
function addChoice(text,fn){
  const btn = document.createElement("button");
  btn.innerText=text;
  btn.onclick=fn;
  choices.appendChild(btn);
}

// ===== 起動 =====
updateStatus();
next();

</script>

</body>
</html>
