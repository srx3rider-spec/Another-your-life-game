<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Another Your Life</title>

<style>
body{
  background:#300;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}
.card{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}
button{
  width:100%;
  margin:5px 0;
  padding:10px;
  background:#3b7ddd;
  color:#fff;
  border:none;
  border-radius:8px;
}
img{
  width:100%;
  margin-bottom:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>Another Your Life</h2>

<div class="card" id="status"></div>
<img id="image">
<div class="card" id="event"></div>
<div id="choices"></div>

<script>

// ===== 状態 =====
let state = {
  age:15,
  hp:100,
  money:50,
  happiness:50,
  hasPartner:false
};

// ===== 画像（完全固定ジャンル）=====
function setImage(type){

  const images = {
    student: "https://picsum.photos/seed/student/800/400",
    work: "https://picsum.photos/seed/office/800/400",
    love: "https://picsum.photos/seed/couple/800/400",
    accident: "https://picsum.photos/seed/accident/800/400",
    money: "https://picsum.photos/seed/money/800/400"
  };

  document.getElementById("image").src = images[type] || images.work;
}

// ===== 表示 =====
function updateStatus(){
  document.getElementById("status").innerText =
    `年齢:${state.age} HP:${state.hp} 金:${state.money} 幸福:${state.happiness}`;
}

// ===== イベント定義（条件付き）=====
const events = [

  {
    text:"好きな人と出会った",
    type:"love",
    condition:s => !s.hasPartner && s.age >=18,
    choices:[
      {
        text:"付き合う",
        effect:s=>{
          s.hasPartner=true;
          s.happiness+=10;
        }
      },
      {
        text:"見送る",
        effect:s=>{
          s.happiness-=2;
        }
      }
    ]
  },

  {
    text:"恋人とデート",
    type:"love",
    condition:s => s.hasPartner,
    choices:[
      {
        text:"楽しむ",
        effect:s=>{
          s.happiness+=15;
        }
      },
      {
        text:"仕事優先",
        effect:s=>{
          s.money+=20;
          s.happiness-=5;
        }
      }
    ]
  },

  {
    text:"仕事がつらい",
    type:"work",
    condition:s => s.age >=18,
    choices:[
      {
        text:"頑張る",
        effect:s=>{
          s.money+=30;
          s.hp-=10;
        }
      },
      {
        text:"休む",
        effect:s=>{
          s.hp+=10;
        }
      }
    ]
  },

  {
    text:"事故にあった",
    type:"accident",
    condition:s => true,
    choices:[
      {
        text:"治療する",
        effect:s=>{
          s.hp+=10;
          s.money-=20;
        }
      },
      {
        text:"放置する",
        effect:s=>{
          s.hp-=15;
        }
      }
    ]
  },

  {
    text:"お金を拾った",
    type:"money",
    condition:s => true,
    choices:[
      {
        text:"拾う",
        effect:s=>{
          s.money+=50;
        }
      },
      {
        text:"無視",
        effect:s=>{
          s.happiness+=2;
        }
      }
    ]
  }

];

// ===== イベント選択 =====
function pickEvent(){
  const list = events.filter(e => e.condition(state));
  return list[Math.floor(Math.random()*list.length)];
}

// ===== メイン =====
function next(){

  if(state.hp <= 0){
    document.getElementById("event").innerText="💀 死亡";
    document.getElementById("choices").innerHTML="";
    return;
  }

  state.age++;

  // 学生フェーズ
  if(state.age < 18){
    setImage("student");
    event.innerText="勉強する？";
    choices.innerHTML="";

    addChoice("勉強",()=>{
      state.happiness+=2;
      next();
    });

    addChoice("遊ぶ",()=>{
      state.hp-=5;
      state.happiness+=5;
      next();
    });

    updateStatus();
    return;
  }

  const e = pickEvent();

  setImage(e.type);
  event.innerText = e.text;
  choices.innerHTML="";

  e.choices.forEach(c=>{
    addChoice(c.text,()=>{
      c.effect(state);
      next();
    });
  });

  updateStatus();
}

// ===== ボタン =====
function addChoice(text,fn){
  const btn = document.createElement("button");
  btn.innerText=text;
  btn.onclick=fn;
  choices.appendChild(btn);
}

// ===== 起動 =====
updateStatus();
next();

</script>

</body>
</html>
