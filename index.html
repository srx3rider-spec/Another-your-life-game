<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Another Your Life</title>
</head>
<body>

<h1>Another Your Life</h1>

<div id="status"></div>
<img id="image" width="300">
<div id="event"></div>
<div id="choices"></div>

<script>
// =====================
// 状態
// =====================
let state = {
  age: 15,
  money: 50,
  hp: 100,
  happiness: 50,
};

// =====================
// 時間進行
// =====================
function advanceTime() {
  state.age += 1;

  if (state.hp <= 0 || state.age > 80) {
    document.getElementById("event").innerText =
      "あなたは" + state.age + "歳で死亡した";
    document.getElementById("choices").innerHTML = "";
    return;
  }
}

// =====================
// イベント
// =====================
const EVENTS = [
  {
    text: s => "今日はどうする？",
    choices: [
      {
        text: "勉強する",
        effect: s => {
          s.happiness -= 2;
          advanceTime();
        }
      },
      {
        text: "遊ぶ",
        effect: s => {
          s.happiness += 5;
          s.hp -= 2;
          advanceTime();
        }
      },
      {
        text: "部活に励む",
        effect: s => {
          s.hp += 3;
          advanceTime();
        }
      }
    ]
  },

  // 🎲 サイコロ
  {
    text: s => "運命の分岐（サイコロ）",
    choices: [
      {
        text: "振る",
        effect: s => {
          const dice = Math.floor(Math.random() * 6) + 1;
          alert("出た目：" + dice);

          if (dice >= 4) {
            s.money += 50;
          } else {
            s.hp -= 20;
          }

          advanceTime();
        }
      }
    ]
  },

  {
    text: s => "バイトを始めた",
    choices: [
      {
        text: "頑張る",
        effect: s => {
          s.money += 30;
          s.hp -= 5;
          advanceTime();
        }
      }
    ]
  },

  {
    text: s => "友達に誘われた",
    choices: [
      {
        text: "行く",
        effect: s => {
          s.happiness += 10;
          advanceTime();
        }
      },
      {
        text: "断る",
        effect: s => {
          s.happiness -= 3;
          advanceTime();
        }
      }
    ]
  }
];

// =====================
// ランダムイベント
// =====================
function pickEvent() {
  return EVENTS[Math.floor(Math.random() * EVENTS.length)];
}

// =====================
// 描画
// =====================
function draw() {
  document.getElementById("status").innerText =
    `年齢:${state.age} 金:${state.money} HP:${state.hp} 幸福:${state.happiness}`;

  // 画像
  const img = document.getElementById("image");
  if (state.age < 18) {
    img.src = "https://source.unsplash.com/300x300/?student";
  } else if (state.age < 40) {
    img.src = "https://source.unsplash.com/300x300/?office";
  } else {
    img.src = "https://source.unsplash.com/300x300/?elderly";
  }

  const event = pickEvent();
  document.getElementById("event").innerText = event.text(state);

  const div = document.getElementById("choices");
  div.innerHTML = "";

  event.choices.forEach(c => {
    const btn = document.createElement("button");
    btn.innerText = c.text;
    btn.onclick = () => {
      c.effect(state);
      draw();
    };
    div.appendChild(btn);
  });
}

// 起動
draw();

</script>

</body>
</html>
